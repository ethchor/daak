# Development mail server for Daak.
#
#   cp .env.example .env
#   docker compose up -d
#
# Stalwart speaks JMAP natively, which is what `@daak/adapter-jmap` is built
# against. This is a DEVELOPMENT setup: it binds to localhost, uses a fixed
# password from .env, and is hardened for nothing.
#
# Validated against stalwartlabs/stalwart:0.16.20. Everything below that looks
# arbitrary was arrived at by watching the container refuse to start; the README
# records what each line is for, and why the version is pinned.

services:
  # Stalwart runs as uid 2000 and does not create its own data directory. A
  # named volume is created root-owned, so without this the server exits with
  # "unable to open database file" and no other explanation.
  init:
    image: stalwartlabs/stalwart:${STALWART_VERSION:-0.16.20}
    container_name: daak-dev-stalwart-init
    user: "0:0"
    entrypoint: ["sh", "-c", "mkdir -p /opt/stalwart/data && chown -R 2000:2000 /opt/stalwart"]
    volumes:
      - stalwart-data:/opt/stalwart

  stalwart:
    image: stalwartlabs/stalwart:${STALWART_VERSION:-0.16.20}
    container_name: daak-dev-stalwart
    restart: unless-stopped
    depends_on:
      init:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:8080:8080" # HTTP: JMAP session, API. What the adapter uses.
      - "127.0.0.1:8443:443" # HTTPS, self-signed. Same routes.
      - "127.0.0.1:1025:25" # SMTP
      - "127.0.0.1:1465:465" # submissions (implicit TLS)
      - "127.0.0.1:1993:993" # IMAPS (for the later adapter)
      - "127.0.0.1:4190:4190" # ManageSieve
    environment:
      # Pins an administrator without the interactive bootstrap flow. Without
      # it the server prints a one-time password to its log and waits for a web
      # UI it has to download from the internet first.
      STALWART_RECOVERY_ADMIN: "admin:${STALWART_ADMIN_SECRET:?set STALWART_ADMIN_SECRET in .env}"
      # The session resource advertises absolute URLs built from this. Left
      # unset, it uses the container's own hostname — so a client reads the
      # session, is handed `https://<container id>/jmap/`, and cannot resolve
      # it. This is the single line that makes the server usable from outside.
      STALWART_PUBLIC_URL: "http://127.0.0.1:8080"
    volumes:
      # A data-store pointer, not a settings file. See the README.
      - ./config.json:/etc/stalwart/config.json:ro
      - stalwart-data:/opt/stalwart
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/healthz/ready"]
      interval: 10s
      timeout: 3s
      retries: 12

volumes:
  stalwart-data:
